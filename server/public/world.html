<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pin Drive World</title>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.125/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>html,body,#cesiumContainer{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#06111b}#status{position:absolute;z-index:5;top:12px;left:12px;padding:8px 12px;background:#071824dd;color:#dff;font:12px Arial;border:1px solid #2d5262;border-radius:8px}.hud{position:absolute;z-index:6;top:54px;width:150px;background:#0a1a27eF;border:1px solid #2d5262;border-radius:10px;color:#eaf7fb;font:12px Arial;box-shadow:0 8px 25px #0006}.hud header{padding:8px 10px;background:#142c3a;cursor:move;border-radius:9px 9px 0 0;color:#62e6c5;font-weight:bold}.hud .body{padding:10px}.hud button{background:#153b3b;border:1px solid #62e6c5;color:#eafffa;border-radius:6px;padding:6px 8px;margin:2px}.hud input{width:100%}#timeHud{left:12px}#voiceHud{left:174px}#mapHud{left:336px}#flagHud{left:498px}#flagImage{width:30px;height:20px;object-fit:cover;vertical-align:middle;margin-right:7px}</style></head>
<body><div id="cesiumContainer"></div><div id="status">Loading Cesium world…</div><section class="hud" id="timeHud"><header>TIME · drag</header><div class="body"><div id="timeLabel">12:00</div><input id="timeSlider" type="range" min="0" max="24" step=".25" value="12"></div></section><section class="hud" id="voiceHud"><header>VOICE · drag</header><div class="body"><button id="voiceButton">Start voice</button><div id="voiceText">Voice control</div></div></section><section class="hud" id="mapHud"><header>MAP · drag</header><div class="body"><button id="modeButton">Switch 2D / 3D</button><div id="mapMode">3D globe</div></div></section><section class="hud" id="flagHud"><header>FLAG · drag</header><div class="body"><div id="flagText">Click the map</div></div></section>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.125/Build/Cesium/Cesium.js"></script>
<script>
(async()=>{
 const status=document.getElementById('status');
 const params=new URLSearchParams(location.search);
 try{
  const cfg=await fetch('/api/config').then(r=>r.json());
  if(cfg.cesiumIonToken) Cesium.Ion.defaultAccessToken=cfg.cesiumIonToken;
  const terrain=cfg.cesiumIonToken?await Cesium.createWorldTerrainAsync({requestVertexNormals:true,requestWaterMask:true}).catch(()=>new Cesium.EllipsoidTerrainProvider()):new Cesium.EllipsoidTerrainProvider();
  const viewer=new Cesium.Viewer('cesiumContainer',{animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:true,navigationHelpButton:false,infoBox:false,selectionIndicator:false,terrainProvider:terrain,baseLayer:false});
  const imagery=viewer.imageryLayers;
  const earth=params.get('earth')||'satellite';
  const opacity=Number(params.get('opacity')||0.65);
  let base;
  if(earth==='satellite'||earth==='satellite-labels'){
   base=imagery.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',credit:'Esri World Imagery'}));
   if(earth==='satellite-labels') imagery.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',credit:'Esri labels'}));
  }else if(earth==='roads'){
   base=imagery.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',credit:'© OpenStreetMap contributors'}));
  }else{
   base=imagery.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',credit:'© OpenStreetMap contributors'}));
  }
  const weather=params.get('weather')||'none';
  const weatherMap={clouds:'clouds_new',precipitation:'precipitation_new',temperature:'temp_new',wind:'wind_new',pressure:'pressure_new'};
  if(weatherMap[weather]&&cfg.openWeatherKey){
   imagery.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://tile.openweathermap.org/map/'+weatherMap[weather]+'/{z}/{x}/{y}.png?appid='+encodeURIComponent(cfg.openWeatherKey),credit:'OpenWeather'})).alpha=opacity;
  }
  viewer.scene.globe.showWaterEffect=true;viewer.scene.skyAtmosphere.show=true;viewer.scene.globe.enableLighting=true;
  if(cfg.cesiumIonToken){try{const buildings=await Cesium.createOsmBuildingsAsync();viewer.scene.primitives.add(buildings)}catch(e){console.warn('3D buildings unavailable',e)}}
  const lat=Number(params.get('lat')),lon=Number(params.get('lon'));
  if(Number.isFinite(lat)&&Number.isFinite(lon)){
   viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(lon,lat,0),point:{pixelSize:13,color:Cesium.Color.fromCssColorString('#62e6c5'),outlineColor:Cesium.Color.WHITE,outlineWidth:2},label:{text:'Destination',font:'14px sans-serif',fillColor:Cesium.Color.WHITE,showBackground:true}});
   viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lon,lat,Number(params.get('camera')==='driver'?900:45000))});
  }else viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(-74.5,40.2,1800000)});
  if(params.get('camera')==='driver'&&Number.isFinite(lat)&&Number.isFinite(lon)){
   viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(lon,lat,6),orientation:{heading:0,pitch:Cesium.Math.toRadians(-5),roll:0}});
  }
  status.textContent='Cesium ready · drag to orbit · wheel to zoom'+(cfg.cesiumIonToken?' · terrain & buildings':' · add CESIUM_ION_TOKEN for terrain');
  // Four movable HUD panels: Time, Voice, Map and Flag.
  document.querySelectorAll('.hud').forEach(panel=>{const handle=panel.querySelector('header');let dx=0,dy=0,drag=false;handle.addEventListener('pointerdown',e=>{drag=true;const r=panel.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!drag)return;panel.style.left=Math.max(0,e.clientX-dx)+'px';panel.style.top=Math.max(0,e.clientY-dy)+'px'});handle.addEventListener('pointerup',()=>drag=false);});
  const slider=document.getElementById('timeSlider'),timeLabel=document.getElementById('timeLabel');
  slider.addEventListener('input',()=>{const hours=Number(slider.value),h=Math.floor(hours),m=Math.round((hours-h)*60);timeLabel.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');const d=new Date();d.setHours(h,m,0,0);viewer.clock.currentTime=Cesium.JulianDate.fromDate(d);viewer.clock.shouldAnimate=false;viewer.scene.requestRender()});
  document.getElementById('modeButton').addEventListener('click',()=>{if(viewer.scene.mode===Cesium.SceneMode.SCENE3D){viewer.scene.morphTo2D(0.7);document.getElementById('mapMode').textContent='2D map'}else{viewer.scene.morphTo3D(0.7);document.getElementById('mapMode').textContent='3D globe'}});
  const voiceButton=document.getElementById('voiceButton'),voiceText=document.getElementById('voiceText');
  voiceButton.addEventListener('click',()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){voiceText.textContent='Speech recognition is not supported in this browser.';return}const rec=new SR();rec.lang='en-US';rec.onstart=()=>{voiceButton.textContent='Listening…';voiceText.textContent='Speak now'};rec.onresult=e=>{voiceText.textContent=e.results[0][0].transcript};rec.onerror=()=>{voiceText.textContent='Microphone unavailable'};rec.onend=()=>{voiceButton.textContent='Start voice'};rec.start()});
  viewer.screenSpaceEventHandler.setInputAction(async movement=>{const cart=viewer.camera.pickEllipsoid(movement.position,viewer.scene.globe.ellipsoid);if(!cart)return;const c=Cesium.Cartographic.fromCartesian(cart),lat=Cesium.Math.toDegrees(c.latitude),lon=Cesium.Math.toDegrees(c.longitude);try{const g=await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage=en').then(r=>r.json());const code=String(g.countryCode||'').toLowerCase();const img=code?'<img id="flagImage" src="https://flagcdn.com/w80/'+code+'.png">':'';document.getElementById('flagText').innerHTML=img+(g.countryName||'International waters')}catch{document.getElementById('flagText').textContent='Location lookup unavailable'}},Cesium.ScreenSpaceEventType.LEFT_CLICK);
  window.pinDriveViewer=viewer;
 }catch(e){status.textContent='Cesium error: '+e.message;console.error(e)}
})();
</script></body></html>
