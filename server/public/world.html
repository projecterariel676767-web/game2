<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pin Drive World</title><link href="https://cesium.com/downloads/cesiumjs/releases/1.125/Build/Cesium/Widgets/widgets.css" rel="stylesheet"><style>html,body,#cesiumContainer{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#06111b}#status{position:absolute;z-index:5;top:12px;left:12px;padding:8px 12px;background:#071824dd;color:#dff;font:12px Arial;border:1px solid #2d5262;border-radius:8px}</style></head><body><div id="cesiumContainer"></div><div id="status">Loading Cesium world…</div><script src="https://cesium.com/downloads/cesiumjs/releases/1.125/Build/Cesium/Cesium.js"></script><script>async function start(){const cfg=await fetch('/api/config').then(r=>r.json());if(cfg.cesiumIonToken)Cesium.Ion.defaultAccessToken=cfg.cesiumIonToken;const viewer=new Cesium.Viewer('cesiumContainer',{animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:true,navigationHelpButton:false,infoBox:false,selectionIndicator:false,terrainProvider:await Cesium.createWorldTerrainAsync().catch(()=>new Cesium.EllipsoidTerrainProvider()),imageryProvider:undefined});viewer.imageryLayers.removeAll();viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',credit:'© OpenStreetMap'}));viewer.scene.globe.showWaterEffect=true;viewer.scene.skyAtmosphere.show=true;viewer.scene.globe.enableLighting=true;viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(-74.5,40.2,1800000)});document.getElementById('status').textContent='Cesium ready · drag to orbit · wheel to zoom';window.pinDriveViewer=viewer;window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='route'&&d.lat&&d.lon){viewer.entities.removeAll();viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(d.lon,d.lat,0),point:{pixelSize:13,color:Cesium.Color.fromCssColorString('#62e6c5'),outlineColor:Cesium.Color.WHITE,outlineWidth:2},label:{text:'Destination',font:'14px sans-serif',fillColor:Cesium.Color.WHITE,showBackground:true}});viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(d.lon,d.lat,45000)})}})}start().catch(e=>document.getElementById('status').textContent='Cesium error: '+e.message)</script></body></html>
