<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pin Drive World</title>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.125/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>html,body,#cesiumContainer{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#06111b}#status{position:absolute;z-index:5;top:12px;left:12px;padding:8px 12px;background:#071824dd;color:#dff;font:12px Arial;border:1px solid #2d5262;border-radius:8px}</style></head>
<body><div id="cesiumContainer"></div><div id="status">Loading Cesium world…</div>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.125/Build/Cesium/Cesium.js"></script>
<script>
(async()=>{
 const status=document.getElementById('status');
 const params=new URLSearchParams(location.search);
 try{
  const cfg=await fetch('/api/config').then(r=>r.json());
  if(cfg.cesiumIonToken) Cesium.Ion.defaultAccessToken=cfg.cesiumIonToken;
  const terrain=cfg.cesiumIonToken?await Cesium.createWorldTerrainAsync({requestVertexNormals:true,requestWaterMask:true}).catch(()=>new Cesium.EllipsoidTerrainProvider()):new Cesium.EllipsoidTerrainProvider();
  const viewer=new Cesium.Viewer('cesiumContainer',{animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:true,navigationHelpButton:false,infoBox:false,selectionIndicator:false,terrainProvider:terrain,baseLayer:false});
  const imagery=viewer.imageryLayers;
  const earth=params.get('earth')||'satellite';
  const opacity=Number(params.get('opacity')||0.65);
  let base;
  if(earth==='satellite'||earth==='satellite-labels'){
   base=imagery.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',credit:'Esri World Imagery'}));
   if(earth==='satellite-labels') imagery.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',credit:'Esri labels'}));
  }else if(earth==='roads'){
   base=imagery.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',credit:'© OpenStreetMap contributors'}));
  }else{
   base=imagery.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',credit:'© OpenStreetMap contributors'}));
  }
  const weather=params.get('weather')||'none';
  const weatherMap={clouds:'clouds_new',precipitation:'precipitation_new',temperature:'temp_new',wind:'wind_new',pressure:'pressure_new'};
  if(weatherMap[weather]&&cfg.openWeatherKey){
   imagery.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://tile.openweathermap.org/map/'+weatherMap[weather]+'/{z}/{x}/{y}.png?appid='+encodeURIComponent(cfg.openWeatherKey),credit:'OpenWeather'})).alpha=opacity;
  }
  viewer.scene.globe.showWaterEffect=true;viewer.scene.skyAtmosphere.show=true;viewer.scene.globe.enableLighting=true;
  if(cfg.cesiumIonToken){try{const buildings=await Cesium.createOsmBuildingsAsync();viewer.scene.primitives.add(buildings)}catch(e){console.warn('3D buildings unavailable',e)}}
  const lat=Number(params.get('lat')),lon=Number(params.get('lon'));
  if(Number.isFinite(lat)&&Number.isFinite(lon)){
   viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(lon,lat,0),point:{pixelSize:13,color:Cesium.Color.fromCssColorString('#62e6c5'),outlineColor:Cesium.Color.WHITE,outlineWidth:2},label:{text:'Destination',font:'14px sans-serif',fillColor:Cesium.Color.WHITE,showBackground:true}});
   viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lon,lat,Number(params.get('camera')==='driver'?900:45000))});
  }else viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(-74.5,40.2,1800000)});
  if(params.get('camera')==='driver'&&Number.isFinite(lat)&&Number.isFinite(lon)){
   viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(lon,lat,6),orientation:{heading:0,pitch:Cesium.Math.toRadians(-5),roll:0}});
  }
  status.textContent='Cesium ready · drag to orbit · wheel to zoom'+(cfg.cesiumIonToken?' · terrain & buildings':' · add CESIUM_ION_TOKEN for terrain');
  window.pinDriveViewer=viewer;
 }catch(e){status.textContent='Cesium error: '+e.message;console.error(e)}
})();
</script></body></html>
