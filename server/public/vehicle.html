<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pin Drive · 3D Vehicle Studio</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080f20;color:#f3f6ff;font-family:Inter,system-ui,Segoe UI,sans-serif}
body{display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 42%,#18294a 0,#0b152b 48%,#070d1c 100%)}
.top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #26395d;background:#0b1428dd}
.brand{font-weight:900;letter-spacing:2px}.brand span{color:#68e1d2}.tag{font-size:9px;letter-spacing:1.5px;color:#8fa5ca}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.glow{position:absolute;width:min(65vw,420px);height:min(65vw,420px);border-radius:50%;background:radial-gradient(circle,#2c75a855 0,#5b56a833 38%,transparent 70%);filter:blur(22px);animation:breathe 5s ease-in-out infinite alternate}
model-viewer{position:relative;width:100%;height:100%;--poster-color:transparent;background:transparent;outline:none}
model-viewer::part(default-progress-bar){background:#68e1d2;height:3px}
model-viewer::part(default-progress-mask){background:#152342}
.footer{padding:10px 16px 12px;border-top:1px solid #26395d;background:#0b1428e8;display:flex;justify-content:space-between;align-items:center;gap:12px}
.name{font-size:14px;font-weight:800}.help{font-size:9px;letter-spacing:1px;color:#8fa5ca;text-align:right}
.credit{font-size:9px;color:#7187aa;padding:0 16px 8px;background:#0b1428e8}
@keyframes breathe{from{transform:scale(.85);opacity:.45}to{transform:scale(1.12);opacity:.9}}
</style>
</head>
<body>
<header class="top"><div class="brand">PIN <span>DRIVE</span></div><div class="tag">VEHICLE INSPECTION · 3D</div></header>
<main class="stage"><div class="glow"></div>
<model-viewer id="car" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CarConcept/glTF-Binary/CarConcept.glb"
 alt="Interactive 3D concept car" camera-controls auto-rotate rotation-per-second="12deg" shadow-intensity="1.2" exposure="1.15" camera-orbit="35deg 68deg 4.2m" min-camera-orbit="auto 20deg 2.3m" max-camera-orbit="auto 140deg 8m" interaction-prompt="auto" touch-action="pan-y">
<div slot="poster" style="color:#9bb3d6;font-size:12px">Loading 3D vehicle…</div>
</model-viewer></main>
<footer class="footer"><div><div class="tag">SELECTED VEHICLE</div><div class="name" id="vehicleName">Concept Car</div><div class="tag" id="modelStatus" style="margin-top:5px">LOADING 3D MODEL…</div></div><div class="help">DRAG TO ROTATE<br>SCROLL / PINCH TO ZOOM</div></footer>
<div class="credit">3D sample asset: Khronos Group · Car Concept · CC BY 4.0. This is a shared preview model pending individual vehicle assets.</div>
<script>
const q=new URLSearchParams(location.search),car=document.getElementById('car'),status=document.getElementById('modelStatus');
const id=q.get('id')||'sports-coupe';
const models={
 'sports-coupe':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CarConcept/glTF-Binary/CarConcept.glb','Concept sports car'],
 'roadster':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CarConcept/glTF-Binary/CarConcept.glb','Concept sports car'],
 'family-suv':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CarConcept/glTF-Binary/CarConcept.glb','SUV category preview'],
 'family-sedan':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CarConcept/glTF-Binary/CarConcept.glb','Sedan category preview'],
 'convertible':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CarConcept/glTF-Binary/CarConcept.glb','Convertible category preview'],
 'mini-ev':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/ToyCar/glTF-Binary/ToyCar.glb','Compact electric category preview'],
 'hatchback':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/ToyCar/glTF-Binary/ToyCar.glb','Compact category preview'],
 'golf-cart':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/ToyCar/glTF-Binary/ToyCar.glb','Small utility category preview'],
 'ice-cream-truck':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb','Commercial truck category preview'],
 'delivery-van':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb','Delivery vehicle category preview'],
 'garbage-truck':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb','Heavy truck category preview'],
 'tow-truck':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb','Recovery truck category preview'],
 'monster-truck':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb','Off-road vehicle category preview'],
 'rescue-vehicle':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb','Emergency vehicle category preview'],
 'police-sedan':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CarConcept/glTF-Binary/CarConcept.glb','Patrol car category preview'],
 'taxi':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CarConcept/glTF-Binary/CarConcept.glb','Taxi category preview'],
 'family-minivan':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb','Van category preview'],
 'limousine':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CarConcept/glTF-Binary/CarConcept.glb','Luxury car category preview'],
 'camper':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb','Camper category preview'],
 'pickup':['https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb','Pickup category preview']
};
const chosen=models[id]||models['sports-coupe'];
document.getElementById('vehicleName').textContent=q.get('name')||'Vehicle';
document.querySelector('.credit').textContent=chosen[1]+' · Khronos glTF Sample Assets. Some entries currently share category preview geometry; individual licensed models are still required for a true 20-car garage.';
car.src=chosen[0];
car.addEventListener('load',()=>status.textContent='3D MODEL READY · DRAG TO INSPECT');
car.addEventListener('error',()=>{status.textContent='MODEL LOAD FAILED · CHECK ASSET URL';});
</script>
</body></html>
